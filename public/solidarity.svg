<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration of a crowd with raised fists in solidarity">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3d6"/>
      <stop offset="1" stop-color="#ffd0c2"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb24d"/>
      <stop offset="1" stop-color="#ec1f27"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="360" r="230" fill="url(#sun)" opacity="0.9"/>

  <!-- rays -->
  <g stroke="#ec1f27" stroke-width="10" opacity="0.18">
    <line x1="400" y1="360" x2="400" y2="0"/>
    <line x1="400" y1="360" x2="120" y2="60"/>
    <line x1="400" y1="360" x2="680" y2="60"/>
    <line x1="400" y1="360" x2="40" y2="300"/>
    <line x1="400" y1="360" x2="760" y2="300"/>
  </g>

  <!-- crowd of raised fists as simple silhouettes -->
  <g fill="#7a0c11">
    <g transform="translate(90,600)">
      <path d="M0,0 v-150 a34,34 0 0 1 68,0 V0 Z"/>
      <path d="M22,-150 v-70 a12,12 0 0 1 24,0 v70 Z"/>
      <circle cx="34" cy="-232" r="26"/>
      <rect x="16" y="-256" width="36" height="26" rx="10"/>
    </g>
  </g>
  <g fill="#a10f16">
    <g transform="translate(250,600)">
      <path d="M0,0 v-190 a40,40 0 0 1 80,0 V0 Z"/>
      <path d="M28,-190 v-90 a13,13 0 0 1 26,0 v90 Z"/>
      <circle cx="41" cy="-296" r="30"/>
      <rect x="20" y="-324" width="42" height="30" rx="12"/>
    </g>
  </g>
  <g fill="#7a0c11">
    <g transform="translate(430,600)">
      <path d="M0,0 v-170 a38,38 0 0 1 76,0 V0 Z"/>
      <path d="M26,-170 v-80 a12,12 0 0 1 24,0 v80 Z"/>
      <circle cx="38" cy="-262" r="28"/>
      <rect x="18" y="-288" width="40" height="28" rx="11"/>
    </g>
  </g>
  <g fill="#a10f16">
    <g transform="translate(600,600)">
      <path d="M0,0 v-200 a42,42 0 0 1 84,0 V0 Z"/>
      <path d="M30,-200 v-95 a13,13 0 0 1 26,0 v95 Z"/>
      <circle cx="43" cy="-312" r="31"/>
      <rect x="21" y="-341" width="44" height="31" rx="12"/>
    </g>
  </g>
</svg>
