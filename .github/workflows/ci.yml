name: CI

# Checks only — no deploying, and no Cloudflare credentials.
#
# BOTH Workers deploy via Cloudflare Workers Builds, connected in the dashboard:
#   svdsa  root directory `/`       production branch red
#   edit   root directory `editor`  production branch red, other branches OFF
#
# `edit` is its own workspace package (editor/package.json), so Workers Builds
# runs the ordinary `bun install && bun run build` in that directory. There is
# deliberately ONE editor deployment: it is a tool, not a per-branch artifact —
# a single instance edits any base branch (`?base=`), and the previews it links
# to are the SITE's branch previews.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run typecheck

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test --project=chromium

      - name: Build
        run: bun run build
