name: CI

# The SITE deploys via Cloudflare Workers Builds (connected in the dashboard),
# which builds and `wrangler deploy`s on push and gives every branch a preview
# URL. The EDITOR Worker isn't part of that integration, so this workflow
# deploys it — from `red` only.
#
# There is deliberately ONE editor deployment. It is a tool, not a per-branch
# artifact: a single instance already edits any base branch (`?base=`), and the
# previews it links to are the SITE's branch previews. Per-branch copies of the
# editor would only add versions to reason about.
#
# Deploying locally with `bun run editor:deploy` keeps working — CI is an
# addition, not a gate.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run fmt:check

      - name: Type check
        run: bun run typecheck

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run tests
        run: bun run test --project=chromium

      - name: Build
        run: bun run build

  # ---- Editor Worker ---------------------------------------------------------
  # Needs CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) in repo secrets. Skipped
  # automatically on forks and when the token isn't configured. The token lives
  # at JOB level because the `env` context — unlike `secrets` — can be read from
  # a step's `if:`, which is how the skip-when-unset check works.
  deploy-editor:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/red'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build editor SPA
        run: bun run editor:build

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: editor
        run: bunx wrangler deploy
